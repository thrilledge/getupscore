<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UpScore</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 128 128">
          <defs>
            <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2563eb"/>
              <stop offset="100%" stop-color="#7c3aed"/>
            </linearGradient>
          </defs>
          <rect width="128" height="128" rx="24" fill="url(#g1)"/>
          <text x="64" y="82" text-anchor="middle" font-family="system-ui" font-weight="900" font-size="64" fill="white">U</text>
          <circle cx="96" cy="40" r="12" fill="#22c55e"/>
        </svg>
      </div>
      <span class="app-name">UpScore</span>
      <span class="status-dot" id="statusDot"></span>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
      <span id="statusText">Initializing...</span>
      <span class="last-check" id="lastCheck"></span>
    </div>

    <!-- Monitoring Mode Indicator -->
    <div class="monitoring-mode" id="monitoringMode">
      <div class="mode-icon" id="modeIcon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 0 1 9-9"/>
        </svg>
      </div>
      <div class="mode-text">
        <span id="modeLabel">Background Monitoring</span>
        <span class="mode-detail" id="modeDetail">Active — checking every 15 min</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="statJobs">0</span>
        <span class="stat-label">Captured</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statSynced">0</span>
        <span class="stat-label">Synced</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statFilters">0</span>
        <span class="stat-label">Filters</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statPending">0</span>
        <span class="stat-label">Pending</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="btnCheck" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Check Now
      </button>
      <button id="btnOptions" class="btn btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Settings
      </button>
    </div>

    <!-- Recent Captures -->
    <div class="section-title" id="sectionTitle">Recent Captures</div>
    <div class="job-list" id="jobList">
      <div class="empty-state">No jobs captured yet.<br>The extension checks Upwork automatically.</div>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
